[project]
name = "tws-exporter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Rampelt", email = "drampelt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ib-async>=1.0.3",
]

[project.scripts]
tws-exporter = "tws_exporter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.8.3",
]
